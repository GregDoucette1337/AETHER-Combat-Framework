name: Reframe AETHER showcase media

on:
  push:
    paths:
      - '.github/workflows/reframe-aether-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reframe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center screenshots
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for path in sorted(Path('assets/screenshots').glob('*.jpg')):
              with Image.open(path) as image:
                  if image.size == (960, 540):
                      image.crop((150, 50, 958, 505)).save(path, quality=88, optimize=True)
                  else:
                      print('Skipping unexpected screenshot size:', path, image.size)
          PY
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Center gameplay video and preview
        run: |
          set -eu
          video='assets/video/AETHER-Combat-Playthrough-Web.mp4'
          ffmpeg -hide_banner -loglevel error -y -i "$video" -vf 'crop=540:304:100:33' -c:v libx264 -preset medium -crf 28 -an -pix_fmt yuv420p -movflags +faststart /tmp/aether-reframed.mp4
          mv /tmp/aether-reframed.mp4 "$video"
          gif='assets/AETHER-gameplay-preview.gif'
          ffmpeg -hide_banner -loglevel error -y -i "$gif" -filter_complex '[0:v]crop=338:190:62:21,split[a][b];[a]palettegen=max_colors=96[p];[b][p]paletteuse=dither=bayer' -loop 0 /tmp/aether-reframed.gif
          mv /tmp/aether-reframed.gif "$gif"
      - name: Publish corrected media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/screenshots assets/video/AETHER-Combat-Playthrough-Web.mp4 assets/AETHER-gameplay-preview.gif
          if ! git diff --cached --quiet; then
            git commit -m 'Center AETHER gameplay screenshots and video'
            git push origin HEAD:main
          fi
